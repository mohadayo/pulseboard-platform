# YAML 静的解析
#
# 目的:
#   `docker-compose.yml`, `.github/workflows/*.yml`, `.github/ISSUE_TEMPLATE/*.yml`
#   等の YAML ファイルに対して、インデント不揃い・末尾スペース・重複キー・
#   コロン後スペース欠落・タブ混入等のフォーマット問題を PR / push 時点で
#   検知する。actionlint とは対象範囲が異なる (actionlint は GitHub Actions の
#   セマンティクス、yamllint は YAML そのもののフォーマット) ため、独立ジョブで
#   併存させる。
#
# 設計上のポイント:
#   - 共有ポリシーは `.yamllint.yml` に集約し、CI とローカル (`yamllint .`) で
#     同じ結果になるようにする。
#   - `pip install yamllint` は 1MB 未満の Python パッケージのみでランナー
#     セットアップが数秒。setup-python の cache は使わずに軽量に導入する。
#   - 権限は `contents: read` のみに限定、`concurrency` で同一 ref の多重実行を抑止。
#   - `paths` は yaml/yml と本ワークフロー・設定に絞る。

name: yamllint

on:
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint.yml'
      - '.yamllint.yaml'
      - '.github/workflows/yamllint.yml'
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint.yml'
      - '.yamllint.yaml'
      - '.github/workflows/yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yamllint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --no-cache-dir 'yamllint==1.38.0'

      - name: Run yamllint
        run: yamllint -c .yamllint.yml -f github .
