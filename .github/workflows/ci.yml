name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ワークフロー・同一 ref (PR ブランチや main) で新しいジョブが起動したら、
# 進行中の古いジョブをキャンセルする。PR に短時間で連続 push した場合の
# 実行枠・実行時間の無駄を削減する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/user-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # バージョンは services/user-api/.python-version に一元化。
          # ローカル (asdf/mise/pyenv) と CI で同じ Python を使うため、
          # ここでは python-version を直書きせずファイル参照する。
          python-version-file: services/user-api/.python-version
          cache: 'pip'
          cache-dependency-path: services/user-api/requirements.txt
      - run: pip install -r requirements.txt
      # lint オプションは services/user-api/.flake8 に集約されているので、
      # CLI では対象パスだけを渡す。
      - run: flake8 .
      - run: pytest -v

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/analytics-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # バージョンは services/analytics-engine/.go-version に一元化。
          go-version-file: services/analytics-engine/.go-version
          cache: true
          # analytics-engine は標準ライブラリのみで go.sum を持たないため、
          # cache-dependency-path は go.mod を指す（setup-go v5 は go.mod でもハッシュを取れる）
          cache-dependency-path: services/analytics-engine/go.mod
      - run: go vet ./...
      - run: go test -v ./...

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # バージョンは services/notification-service/.nvmrc に一元化。
          node-version-file: services/notification-service/.nvmrc
          cache: 'npm'
          cache-dependency-path: services/notification-service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-python, test-go, test-typescript]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
